{"name": "daily-breakout-screen", "on": {"schedule": [{"cron": "40 21 * * 1-5"}], "workflow_dispatch": {}}, "concurrency": "screen", "permissions": {"contents": "write"}, "jobs": {"screen": {"runs-on": "ubuntu-latest", "timeout-minutes": 150, "steps": [{"uses": "actions/checkout@v4"}, {"uses": "actions/setup-node@v4", "with": {"node-version": 20}}, {"name": "probe data sources", "run": "for u in 'https://query1.finance.yahoo.com/v8/finance/chart/AAPL?range=1mo&interval=1d' 'https://api.nasdaq.com/api/quote/AAPL/historical?assetclass=stocks&fromdate=2026-09-01&limit=5&todate=2026-12-31'; do echo \"$u -> $(curl -s -m 20 -o /dev/null -w '%{http_code}' -A 'Mozilla/5.0 Chrome/124' \"$u\")\"; done", "continue-on-error": true}, {"name": "screen", "run": "node screen.mjs | tee screen.log"}, {"name": "publish", "run": "git config user.name screener && git config user.email screener@users.noreply.github.com && git add candidates.json alerts.json && (git diff --cached --quiet || (git commit -m 'daily screen' && git pull --rebase -q; git push))"}]}}}
