{"name": "scan-news", "on": {"schedule": [{"cron": "*/20 * * * *"}], "workflow_dispatch": {}}, "concurrency": "scan", "permissions": {"contents": "write"}, "jobs": {"scan": {"runs-on": "ubuntu-latest", "steps": [{"uses": "actions/checkout@v4"}, {"uses": "actions/setup-node@v4", "with": {"node-version": 20}}, {"run": "node scan.mjs", "env": {"GEMINI_API_KEY": "${{ secrets.GEMINI_API_KEY }}"}}, {"run": "git config user.name scanner && git config user.email scanner@users.noreply.github.com && git add events.json && (git diff --cached --quiet || (git commit -m scan && git pull --rebase -q; git push))"}]}}}
