name: event-momentum-study
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: data pipeline
        run: cd eventstudy && node 1-pipeline.mjs
      - name: event study
        run: cd eventstudy && node 2-research_events.mjs
      - name: momentum study
        run: cd eventstudy && node 3-research_momentum.mjs
      - name: publish
        if: always()
        run: |
          git config user.name screener && git config user.email screener@users.noreply.github.com
          for f in calendar.json universe_dir.json research_events.json research_momentum.json momentum_now.json; do [ -f eventstudy/$f ] && git add eventstudy/$f; done
          (git diff --cached --quiet || (git commit -m 'event + momentum study' && git pull --rebase -q; git push))
